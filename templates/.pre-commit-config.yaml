repos:
  - repo: local
    hooks:
      - id: gradle-check
        name: ./gradlew check (spotless, checkstyle, tests, JaCoCo)
        entry: ./gradlew check
        language: system
        pass_filenames: false
        # Este archivo solo dice QUE correr. El hook lo activa cada persona en su clon:
        #   pip install pre-commit && pre-commit install
        # A partir de ahi corre ./gradlew check en cada commit.
