# Workflow REUTILIZABLE: publica las librerias del servicio en GitHub Packages.
#   uses: IngSis-MAK-LR-DK/ci-kit/.github/workflows/java-publish.yml@v1
name: Java Publish

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "17"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish package
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
