# CI del propio ci-kit: antes de mergear un cambio, comprueba que el plugin compila y que
# el servicio de ejemplo sigue pasando `check` con las reglas nuevas.
name: Self test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew :plugin:build

      - name: Check sample service
        run: ./gradlew -p examples/sample-service check
