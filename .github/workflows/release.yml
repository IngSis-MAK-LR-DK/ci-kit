# Al crear un Release en GitHub, publica el plugin en GitHub Packages.
# Acordate de subir `version` en plugin/build.gradle.kts antes de crear el release.
name: Release

on:
  release:
    types: [ created ]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish plugin
        run: ./gradlew :plugin:publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
